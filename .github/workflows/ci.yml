name: CI

on:
  pull_request:
    branches: [main]

env:
  SNYK_TOKEN: ${{ secrets.SNYK_SAAS_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CHROME_BIN: /usr/bin/google-chrome-stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install UI dependencies
        run: cd ui && pnpm install --frozen-lockfile

      - name: Run linting
        run: make lint

      - name: Build dev Docker image
        run: make build-dev

      - name: Run tests
        run: make test

      - name: Build CI Docker image
        run: make build-ci

      - name: Snyk container test
        if: env.SNYK_TOKEN != ''
        run: |
          snyk container test brewhouse-manager:ci \
            --exclude-base-image-vulns \
            --severity-threshold=high \
            --project-name=brewhouse-manager:main \
            --file=./Dockerfile \
            --platform=$(docker inspect brewhouse-manager:ci --format='{{.Os}}/{{.Architecture}}')